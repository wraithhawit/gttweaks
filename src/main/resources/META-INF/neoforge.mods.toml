modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Java-side fixes for running GregTech CEu Modern in All the Mods 10. GregTech
8.0.0-SNAPSHOT is the only 1.21.1 build binary-compatible with the KubeJS this
pack ships, but on a JEI-only client it cannot finish mod loading: a recipe
viewer icon reaches for JEI's runtime during registry init. Everything else
about GregTech here is driven from KubeJS scripts; this mod exists only for what
a script cannot reach.

With Refined Storage installed it also adds multiblock parts that feed a
GregTech multiblock from an RS network, the way GregTech's own ME parts do from
an AE2 one.
'''

[[mixins]]
config="${mod_id}.modularui.mixins.json"
requiredMods=["modularui"]

# Only the JEI call wrapper needs JEI. The common GregTech fixes (recipe parsing, circuit
# selection, energy transfer) must still apply on a server or client without it.
[[mixins]]
config="${mod_id}.gtceu.mixins.json"
requiredMods=["gtceu"]

[[mixins]]
config="${mod_id}.jei.mixins.json"
requiredMods=["gtceu","jei"]

[[mixins]]
config="${mod_id}.emi.mixins.json"
requiredMods=["emi"]

# GregTech programmed circuits on Refined Storage processing patterns (stored at encode, set on push).
[[mixins]]
config="${mod_id}.refinedstorage.mixins.json"
requiredMods=["gtceu","refinedstorage"]

# GregTech's JourneyMap layer options; JourneyMap 6.0.9's client never binds them.
[[mixins]]
config="${mod_id}.journeymap.mixins.json"
requiredMods=["gtceu","journeymap"]

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="gtceu"
    type="required"
    versionRange="[${gtceu_version},)"
    ordering="AFTER"
    side="BOTH"

# Client-only bugs, but both are the mixin targets, so they must load first.
# GregTech jar-in-jars ModularUI.
[[dependencies.${mod_id}]]
    modId="modularui"
    type="required"
    versionRange="[3.3.1-SNAPSHOT,)"
    ordering="AFTER"
    side="CLIENT"

# The Refined Storage multiblock parts register only when Refined Storage is present, and nothing
# else here needs it. AFTER because the parts ask RS for a node container as they are built.
[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="optional"
    versionRange="[2.0.9,)"
    ordering="AFTER"
    side="BOTH"

# rsapg (Advanced Pattern Grid): gttweaks tells its EMI recipe-tree dump about GregTech machines.
[[dependencies.${mod_id}]]
    modId="rsapg"
    type="optional"
    versionRange="[0.1.9,)"
    ordering="NONE"
    side="BOTH"
